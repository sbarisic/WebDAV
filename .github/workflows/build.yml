name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore VirtualWebDav.sln
      - run: dotnet test VirtualWebDav.sln -c Release --no-restore --logger trx
      - run: dotnet pack src/VirtualWebDav/VirtualWebDav.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            tests/**/TestResults/*.trx
